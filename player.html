<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hit Quiz</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

body {
background: #0a0a0a;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
font-family: -apple-system, sans-serif;
overflow: hidden;
}

/* Animated rings */
.rings {
position: fixed;
inset: 0;
display: flex;
align-items: center;
justify-content: center;
pointer-events: none;
}
.ring {
position: absolute;
border-radius: 50%;
border: 2px solid;
opacity: 0;
}
.ring.active { animation: rpulse 2s ease-out infinite; }
.ring:nth-child(1){ width:100px;  height:100px;  border-color:#FFD700; animation-delay:0s;    }
.ring:nth-child(2){ width:180px;  height:180px;  border-color:#FF1D58; animation-delay:0.5s;  }
.ring:nth-child(3){ width:270px;  height:270px;  border-color:#00FFFF; animation-delay:1s;    }
.ring:nth-child(4){ width:370px;  height:370px;  border-color:#FFD700; animation-delay:1.5s;  }
@keyframes rpulse {
0%   { opacity:.65; transform:scale(.8);  }
100% { opacity:0;   transform:scale(1.2); }
}

/* Center UI */
.ui {
position: relative;
z-index: 10;
display: flex;
flex-direction: column;
align-items: center;
gap: 28px;
}

/* Progress ring */
.prog-wrap {
position: relative;
width: 160px;
height: 160px;
}
.prog-wrap svg {
position: absolute;
inset: 0;
transform: rotate(-90deg);
}
.track { fill:none; stroke:rgba(255,255,255,.1); stroke-width:8; }
.arc   {
fill:none;
stroke: url(#grad);
stroke-width:8;
stroke-linecap:round;
stroke-dasharray: 408; /* 2π×65 */
stroke-dashoffset: 0;
transition: stroke-dashoffset 1s linear;
}
.center-icon {
position: absolute;
inset: 0;
display: flex;
align-items: center;
justify-content: center;
flex-direction: column;
gap: 4px;
}
.center-icon .icon-note {
font-size: 2.8rem;
line-height: 1;
}
.center-icon .timer {
font-size: 1rem;
font-weight: 700;
color: rgba(255,255,255,.5);
letter-spacing: 1px;
}

/* State: loading — spinner replaces arc */
.spinner-wrap {
position: relative;
width: 160px;
height: 160px;
display: none;
}
.spinner-wrap svg {
position: absolute;
inset: 0;
transform: rotate(-90deg);
animation: spin 1.2s linear infinite;
}
@keyframes spin { to { transform: rotate(270deg); } }
.spin-arc {
fill: none; stroke: #FF1D58; stroke-width: 8;
stroke-linecap: round;
stroke-dasharray: 408;
stroke-dashoffset: 300;
}
.spinner-wrap .center-icon { position: absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.spinner-wrap .center-icon span { font-size:2.2rem; }

/* Status text */
.status {
color: rgba(255,255,255,.45);
font-size: .85rem;
text-align: center;
min-height: 20px;
letter-spacing: .5px;
}

/* Replay button */
.btn-replay {
display: none;
background: rgba(255,255,255,.1);
border: 1px solid rgba(255,255,255,.25);
color: #fff;
padding: 14px 40px;
border-radius: 50px;
font-size: 1rem;
font-weight: 600;
letter-spacing: 2px;
cursor: pointer;
transition: background .2s;
-webkit-tap-highlight-color: transparent;
}
.btn-replay:active { background: rgba(255,255,255,.22); }

/* Tap to start (autoplay blocked) */
.btn-tap {
display: none;
background: #FF1D58;
border: none;
color: #fff;
padding: 18px 52px;
border-radius: 50px;
font-size: 1.1rem;
font-weight: 700;
letter-spacing: 2px;
cursor: pointer;
box-shadow: 0 0 30px rgba(255,29,88,.5);
-webkit-tap-highlight-color: transparent;
animation: pulse-btn 1.4s ease-in-out infinite;
}
@keyframes pulse-btn {
0%,100%{ transform:scale(1);   box-shadow:0 0 30px rgba(255,29,88,.5); }
50%    { transform:scale(1.04);box-shadow:0 0 44px rgba(255,29,88,.75); }
}

/* Error state */
.error-msg {
display: none;
color: rgba(255,255,255,.35);
font-size: .9rem;
text-align: center;
line-height: 1.6;
max-width: 240px;
}
</style>

</head>
<body>

<div class="rings">
  <div class="ring" id="r1"></div>
  <div class="ring" id="r2"></div>
  <div class="ring" id="r3"></div>
  <div class="ring" id="r4"></div>
</div>

<div class="ui">

  <!-- Loading spinner (visible while fetching) -->

  <div class="spinner-wrap" id="spinner">
    <svg viewBox="0 0 160 160">
      <circle class="spin-arc" cx="80" cy="80" r="65"/>
    </svg>
    <div class="center-icon"><span>🎵</span></div>
  </div>

  <!-- Progress ring (visible while playing) -->

  <div class="prog-wrap" id="prog-wrap" style="display:none">
    <svg viewBox="0 0 160 160">
      <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#FF1D58"/>
          <stop offset="100%" stop-color="#FFD700"/>
        </linearGradient>
      </defs>
      <circle class="track" cx="80" cy="80" r="65"/>
      <circle class="arc"   cx="80" cy="80" r="65" id="arc"/>
    </svg>
    <div class="center-icon">
      <span class="icon-note">🎵</span>
      <span class="timer" id="timer">30</span>
    </div>
  </div>

  <div class="status"    id="status"></div>
  <button class="btn-tap"    id="btn-tap"    onclick="manualPlay()">▶ LANCER</button>
  <button class="btn-replay" id="btn-replay" onclick="replay()">↺ REJOUER</button>
  <div class="error-msg" id="error-msg"></div>

</div>

<audio id="audio" preload="auto"></audio>

<script>
  const DURATION  = 30;
  const CIRCUMF   = 2 * Math.PI * 65; // ≈ 408

  // URL params
  const p      = new URLSearchParams(window.location.search);
  const artist = p.get('a') || '';
  const title  = p.get('t') || '';

  const audio     = document.getElementById('audio');
  const arc       = document.getElementById('arc');
  const elTimer   = document.getElementById('timer');
  const elStatus  = document.getElementById('status');
  const spinner   = document.getElementById('spinner');
  const progWrap  = document.getElementById('prog-wrap');
  const btnTap    = document.getElementById('btn-tap');
  const btnReplay = document.getElementById('btn-replay');
  const errMsg    = document.getElementById('error-msg');
  const rings     = document.querySelectorAll('.ring');

  let timerHandle = null;
  let previewUrl  = null;

  /* ── Fetch with multiple CORS proxies as fallback ── */
  const PROXIES = [
    url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
    url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    url => `https://cors-anywhere.herokuapp.com/${url}`,
  ];

  async function fetchItunes() {
    const q        = encodeURIComponent(`${artist} ${title}`);
    const itunesUrl = `https://itunes.apple.com/search?term=${q}&media=music&limit=8&entity=song`;

    // Try direct first (works on some setups), then proxies
    const attempts = [
      () => fetch(itunesUrl),
      ...PROXIES.map(proxy => () => fetch(proxy(itunesUrl))),
    ];

    for (const attempt of attempts) {
      try {
        const resp = await attempt();
        if (!resp.ok) continue;
        const data = await resp.json();
        if (!data.results || data.results.length === 0) continue;

        const a    = artist.toLowerCase().split(' ')[0];
        let best   = data.results.find(r => r.artistName.toLowerCase().includes(a) && r.previewUrl);
        if (!best) best = data.results.find(r => r.previewUrl);
        if (best && best.previewUrl) return best.previewUrl;
      } catch(e) { /* try next */ }
    }
    return null;
  }

  /* ── UI states ── */
  function setLoading() {
    spinner.style.display  = 'block';
    progWrap.style.display = 'none';
    elStatus.textContent   = '';
    btnTap.style.display   = 'none';
    btnReplay.style.display= 'none';
    errMsg.style.display   = 'none';
  }

  function setPlaying() {
    spinner.style.display  = 'none';
    progWrap.style.display = 'block';
    btnTap.style.display   = 'none';
    btnReplay.style.display= 'none';
    errMsg.style.display   = 'none';
    elStatus.textContent   = '';
    rings.forEach(r => r.classList.add('active'));
  }

  function setNeedsTap() {
    spinner.style.display  = 'none';
    progWrap.style.display = 'block';
    btnTap.style.display   = 'inline-block';
    elStatus.textContent   = '';
  }

  function setFinished() {
    rings.forEach(r => r.classList.remove('active'));
    elTimer.textContent    = '0';
    arc.style.strokeDashoffset = CIRCUMF;
    btnReplay.style.display= 'inline-block';
    elStatus.textContent   = '';
  }

  function setError(msg) {
    spinner.style.display  = 'none';
    progWrap.style.display = 'none';
    errMsg.style.display   = 'block';
    errMsg.innerHTML       = msg;
  }

  /* ── Timer ── */
  function startTimer() {
    clearInterval(timerHandle);
    let remaining = DURATION;
    elTimer.textContent = remaining;
    arc.style.transition = 'none';
    arc.style.strokeDashoffset = 0;

    requestAnimationFrame(() => requestAnimationFrame(() => {
      arc.style.transition = `stroke-dashoffset ${DURATION}s linear`;
      arc.style.strokeDashoffset = CIRCUMF;
    }));

    timerHandle = setInterval(() => {
      remaining--;
      elTimer.textContent = Math.max(0, remaining);
      if (remaining <= 0) { clearInterval(timerHandle); setFinished(); }
    }, 1000);
  }

  /* ── Play ── */
  function doPlay() {
    setPlaying();
    audio.play().then(() => {
      startTimer();
    }).catch(() => {
      setNeedsTap();
    });
  }

  function manualPlay() {
    btnTap.style.display = 'none';
    audio.play().then(() => {
      setPlaying();
      startTimer();
    });
  }

  function replay() {
    btnReplay.style.display = 'none';
    audio.currentTime = 0;
    doPlay();
  }

  /* ── Audio events ── */
  audio.addEventListener('ended', () => {
    clearInterval(timerHandle);
    setFinished();
  });

  /* ── Boot ── */
  (async () => {
    setLoading();
    const url = await fetchItunes();
    if (!url) {
      setError('Aperçu audio<br>non disponible 😕');
      return;
    }
    previewUrl      = url;
    audio.src       = url;
    audio.load();
    doPlay();
  })();
</script>

</body>
</html>
