<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hit Quiz – Lecture</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

body {
background: #0a0a0a;
color: #fff;
font-family: ‘Playfair Display’, Georgia, serif;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
overflow: hidden;
}

/* Animated background rings */
.bg-rings {
position: fixed;
inset: 0;
display: flex;
align-items: center;
justify-content: center;
pointer-events: none;
z-index: 0;
}
.ring {
position: absolute;
border-radius: 50%;
border: 2px solid;
opacity: 0;
}
.ring.pulse {
animation: ring-pulse 2.4s ease-out infinite;
}
.ring:nth-child(1) { width:120px; height:120px; border-color: #FFD700; animation-delay: 0s; }
.ring:nth-child(2) { width:200px; height:200px; border-color: #FF1D58; animation-delay: 0.6s; }
.ring:nth-child(3) { width:290px; height:290px; border-color: #00FFFF; animation-delay: 1.2s; }
.ring:nth-child(4) { width:390px; height:390px; border-color: #FFD700; animation-delay: 1.8s; }
@keyframes ring-pulse {
0%   { opacity: 0.7; transform: scale(0.85); }
100% { opacity: 0;   transform: scale(1.15); }
}

/* Card */
.card {
position: relative;
z-index: 1;
background: #FF1D58;
border-radius: 20px;
width: 88vw;
max-width: 340px;
padding: 36px 28px 28px;
display: flex;
flex-direction: column;
align-items: center;
gap: 10px;
box-shadow: 0 20px 60px rgba(255,29,88,.45);
text-align: center;
}
.card::before {
content: ‘’;
position: absolute;
top: -25%; right: -15%;
width: 55%; height: 150%;
background: rgba(255,255,255,.07);
transform: rotate(-18deg);
border-radius: 4px;
pointer-events: none;
}

.label-artiste {
font-size: 0.65rem;
text-transform: uppercase;
letter-spacing: 3px;
color: rgba(255,255,255,.7);
position: relative;
}
.annee {
font-family: ‘Anton’, sans-serif;
font-size: 5.5rem;
line-height: 1;
color: #fff;
text-shadow: 4px 4px 0 rgba(0,0,0,.22);
position: relative;
}
.label-titre {
font-style: italic;
font-size: 1rem;
color: rgba(255,255,255,.92);
line-height: 1.4;
position: relative;
}

/* Progress ring */
.progress-wrap {
margin-top: 18px;
position: relative;
width: 100px;
height: 100px;
flex-shrink: 0;
}
.progress-wrap svg {
position: absolute;
inset: 0;
transform: rotate(-90deg);
}
.progress-bg { fill: none; stroke: rgba(255,255,255,.15); stroke-width: 6; }
.progress-arc {
fill: none;
stroke: #FFD700;
stroke-width: 6;
stroke-linecap: round;
stroke-dasharray: 283; /* 2π×45 */
stroke-dashoffset: 0;
transition: stroke-dashoffset 1s linear;
}
.progress-inner {
position: absolute;
inset: 0;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
}
.timer-val {
font-family: ‘Anton’, sans-serif;
font-size: 1.6rem;
line-height: 1;
color: #fff;
}
.timer-lbl {
font-size: 0.5rem;
letter-spacing: 2px;
color: rgba(255,255,255,.5);
text-transform: uppercase;
margin-top: 2px;
}

/* Status messages */
.status {
margin-top: 6px;
font-size: 0.72rem;
color: rgba(255,255,255,.55);
font-style: italic;
min-height: 18px;
position: relative;
}

/* Replay button */
.btn-replay {
margin-top: 10px;
background: rgba(255,255,255,.15);
border: 1px solid rgba(255,255,255,.35);
color: #fff;
padding: 10px 28px;
border-radius: 8px;
font-family: ‘Anton’, sans-serif;
font-size: 0.85rem;
letter-spacing: 2px;
cursor: pointer;
display: none;
transition: background .2s;
position: relative;
}
.btn-replay:hover { background: rgba(255,255,255,.28); }

/* State: loading */
body.loading .ring { opacity: 0 !important; animation: none !important; }
body.loading .status::after {
content: ‘’;
display: inline-block;
width: 6px; height: 6px;
background: rgba(255,255,255,.6);
border-radius: 50%;
animation: dot-blink .8s infinite alternate;
}
@keyframes dot-blink { from { opacity:.2 } to { opacity:1 } }

/* State: error */
body.error .card { background: #222; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
body.error .annee { font-size: 3rem; }

/* Finished */
.finished-icon { font-size: 2rem; display: none; }
</style>

</head>
<body class="loading">

<div class="bg-rings">
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="ring"></div>
</div>

<div class="card">
  <div class="label-artiste" id="el-artiste">—</div>
  <div class="annee"         id="el-annee">—</div>
  <div class="label-titre"   id="el-titre">—</div>

  <div class="progress-wrap" id="el-progress" style="display:none">
    <svg viewBox="0 0 100 100">
      <circle class="progress-bg" cx="50" cy="50" r="45"/>
      <circle class="progress-arc" id="arc" cx="50" cy="50" r="45"/>
    </svg>
    <div class="progress-inner">
      <div class="timer-val" id="el-timer">30</div>
      <div class="timer-lbl">secondes</div>
    </div>
  </div>

  <div class="finished-icon" id="el-check">✅</div>
  <div class="status" id="el-status">Recherche en cours…</div>
  <button class="btn-replay" id="btn-replay" onclick="replay()">↺ REJOUER</button>
</div>

<audio id="audio" preload="auto"></audio>

<script>
  const DURATION   = 30;
  const CIRCUMF    = 2 * Math.PI * 45; // ≈ 283

  const params   = new URLSearchParams(window.location.search);
  const artist   = params.get('a') || '';
  const title    = params.get('t') || '';
  const year     = params.get('y') || '';
  const dispA    = params.get('da') || artist;
  const dispT    = params.get('dt') || title;

  document.getElementById('el-artiste').textContent = dispA;
  document.getElementById('el-annee').textContent   = year;
  document.getElementById('el-titre').textContent   = dispT;

  const audio    = document.getElementById('audio');
  const arc      = document.getElementById('arc');
  const elTimer  = document.getElementById('el-timer');
  const elStatus = document.getElementById('el-status');
  const elProg   = document.getElementById('el-progress');
  const elCheck  = document.getElementById('el-check');
  const btnReplay= document.getElementById('btn-replay');

  let timerHandle = null;
  let previewUrl  = null;

  /* ── Fetch iTunes preview ── */
  async function fetchPreview() {
    const q = encodeURIComponent(`${artist} ${title}`);
    const url = `https://itunes.apple.com/search?term=${q}&media=music&limit=8&entity=song`;
    const resp = await fetch(url);
    const data = await resp.json();
    if (!data.results || data.results.length === 0) return null;
    const a = artist.toLowerCase().split(' ')[0];
    let best = data.results.find(r => r.artistName.toLowerCase().includes(a) && r.previewUrl);
    if (!best) best = data.results.find(r => r.previewUrl);
    return best ? best.previewUrl : null;
  }

  /* ── Start playback ── */
  function startPlay(url) {
    previewUrl = url;
    audio.src  = url;
    audio.currentTime = 0;
    elStatus.textContent = '';
    elProg.style.display = 'block';
    arc.style.strokeDashoffset = 0;
    document.body.classList.remove('loading');

    // Activate pulsing rings
    document.querySelectorAll('.ring').forEach(r => r.classList.add('pulse'));

    audio.play().catch(() => {
      // Autoplay blocked — show tap-to-play hint
      elStatus.textContent = 'Appuyez pour lancer ▶';
      document.body.addEventListener('click', () => { audio.play(); elStatus.textContent = ''; }, { once: true });
    });
  }

  /* ── Timer & arc ── */
  audio.addEventListener('play', () => {
    clearInterval(timerHandle);
    let remaining = DURATION;
    elTimer.textContent = remaining;
    arc.style.strokeDashoffset = 0;

    timerHandle = setInterval(() => {
      remaining--;
      elTimer.textContent = Math.max(0, remaining);
      // dashoffset goes from 0 → CIRCUMF (full circle consumed)
      const offset = CIRCUMF * (1 - remaining / DURATION);
      arc.style.strokeDashoffset = offset;
      if (remaining <= 0) {
        clearInterval(timerHandle);
        onFinished();
      }
    }, 1000);
  });

  audio.addEventListener('ended', () => { clearInterval(timerHandle); onFinished(); });

  function onFinished() {
    audio.pause();
    document.querySelectorAll('.ring').forEach(r => r.classList.remove('pulse'));
    elTimer.textContent = '0';
    arc.style.strokeDashoffset = CIRCUMF;
    elStatus.textContent = 'Extrait terminé';
    elCheck.style.display = 'block';
    btnReplay.style.display = 'inline-block';
  }

  function replay() {
    if (!previewUrl) return;
    elCheck.style.display  = 'none';
    btnReplay.style.display= 'none';
    elStatus.textContent   = '';
    arc.style.strokeDashoffset = 0;
    elTimer.textContent    = DURATION;
    document.querySelectorAll('.ring').forEach(r => r.classList.add('pulse'));
    audio.currentTime = 0;
    audio.play();
  }

  /* ── Boot ── */
  (async () => {
    try {
      const url = await fetchPreview();
      if (!url) throw new Error('no preview');
      startPlay(url);
    } catch(e) {
      document.body.classList.add('error');
      document.body.classList.remove('loading');
      elStatus.textContent = 'Aperçu non disponible 😕';
      elProg.style.display = 'none';
    }
  })();
</script>

</body>
</html>
